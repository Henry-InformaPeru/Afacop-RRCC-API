<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Consulta RRCC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contenedor {
      width: 900px;
      max-width: 94%;
      background: white;
      padding: 32px;
      border-radius: 12px;

      box-shadow:
        0 10px 30px
        rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .descripcion {
      color: #6b7280;
      margin-bottom: 24px;
    }

    .formulario {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;

      padding: 13px 14px;

      font-size: 16px;

      border:
        1px solid #d1d5db;

      border-radius: 7px;

      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      padding: 13px 24px;

      border: none;
      border-radius: 7px;

      background: #111827;
      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    button:hover {
      background: #374151;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .resultado-titulo {
      margin-top: 28px;
      margin-bottom: 10px;

      font-weight: bold;
    }

    pre {
      min-height: 180px;
      max-height: 500px;

      overflow: auto;

      margin: 0;

      padding: 20px;

      border-radius: 8px;

      background: #111827;
      color: #f9fafb;

      font-size: 14px;
      line-height: 1.5;

      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <h1>Consulta RRCC</h1>

    <div class="descripcion">
      Ingrese el DNI para realizar la consulta.
    </div>

    <div class="formulario">

      <input
        id="dni"
        type="text"
        inputmode="numeric"
        maxlength="8"
        placeholder="Ingrese DNI"
        autocomplete="off"
      >

      <button id="btnConsultar">
        Consultar
      </button>

    </div>

    <div class="resultado-titulo">
      Resultado
    </div>

    <pre id="resultado">Ingrese un DNI para consultar.</pre>

  </main>

  <script src="/app.js"></script>

</body>
</html>
